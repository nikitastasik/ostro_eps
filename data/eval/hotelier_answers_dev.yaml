  expect: {crib: true, kids_club: true, kids_menu: false}
- char_key: elevator
  answer: "Здание пятиэтажное, лифт установлен"
  expect: {available: true}
- char_key: elevator
  answer: "К сожалению, лифта в здании нет"
  expect: {available: false}
- char_key: accessibility
  answer: "Вход без ступенек, есть лифт и адаптированный номер"
  expect: {wheelchair: "yes"}
- char_key: building_levels
  answer: "Всего 12 этажей"
  expect: {levels: 12}
- char_key: building_levels
  answer: "Здание двухэтажное"
  expect: {levels: 2}
- char_key: building_history
  answer: "Дом построен в 1910 году, это бывшая дача, объект культурного наследия"
  expect: {year_built: 1910, heritage: true}
- char_key: sea_view
  answer: "Море видно только с верхних этажей, начиная с седьмого"
  expect: {available: true, min_floor: 7}
- char_key: sea_view
  answer: "Из окон моря не видно, вид во двор"
  expect: {available: false}
- char_key: car_access
  answer: "Парковки у отеля нет. К подъезду подъехать нельзя, пешеходная улица."
  expect: {own_parking: false, car_to_door: false}
- char_key: car_access
  answer: "Закрытая охраняемая стоянка во дворе, 500 руб/сутки"
  expect: {own_parking: true, parking_fee_rub: 500}
