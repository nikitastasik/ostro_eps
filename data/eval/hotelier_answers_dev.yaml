# Dev-выборка №2 (бывшая отложенная): после первого замера на ней расширялись словари,
# поэтому это уже не честная отложенная выборка. Честная — *_holdout.yaml.
- char_key: pets_policy
  answer: "Животные допускаются по согласованию с администрацией, вес до 8 кг, стоимость 600 рублей/сутки"
  expect: {allowed: true, max_weight_kg: 8, fee_rub: 600, fee_unit: night}
- char_key: pets_policy
  answer: "С питомцами заселение запрещено"
  expect: {allowed: false}
- char_key: pets_policy
  answer: "Берём котов и небольших собачек. Доплаты нет."
  expect: {allowed: true, animals: [cat, dog], fee_rub: 0}
- char_key: blackout_curtains
  answer: "В номерах стоят рольставни и плотные портьеры, темно даже днём"
  expect: {available: true}
- char_key: blackout_curtains
  answer: "Нет, только лёгкие шторы"
  expect: {available: false}
- char_key: soundproofing
  answer: "Мы меняли окна в 2021 году на звукоизолирующие"
  expect: {windows: soundproof}
- char_key: soundproofing
  answer: "Окна обычные, двухкамерный стеклопакет"
  expect: {windows: standard}
- char_key: workspace
  answer: "Письменный стол и кресло в каждом номере. Оптоволокно 300 Мбит/с."
  expect: {desk: true, wifi_mbps: 300}
- char_key: workspace
  answer: "Рабочего места в номерах нет, но есть переговорная на первом этаже"
