- key: accessibility
  title: Доступная среда
  group: hotelier
  scope: hotel
  icon: wheelchair
  description: Доступен ли отель для гостей на коляске (тег wheelchair в OSM и ответ отельера).
  value_fields:
    wheelchair: {type: enum, values: [yes, limited, no], title: Доступность для коляски}
  recipe:
    - tool: osm.hotel_tag
      params: {tags: [wheelchair]}
    - tool: hotelier.ask
      when: missing
  confidence_threshold: 0.5
  ttl_days: 730
  conflict:
    fields:
      - {field: wheelchair, type: enum}
    authority: [hotelier_confirmed, hotelier, osm]
    policy: priority
  question:
    text: Доступен ли отель для гостей на инвалидной коляске — пандус, лифт, номера без порогов?
    fields: [wheelchair]
  search:
    label: Доступно на коляске
    phrases: [инвалидн, на коляске, колясочник, доступная среда, без порогов, пандус, маломобильн]
    criteria:
      - {field: wheelchair, op: in, value: ["yes", limited]}

- key: room_orientation
  title: Куда выходят окна номеров
  group: hotelier
  scope: hotel
  icon: compass
  description: >-
    Какие категории номеров выходят на какую сторону здания. Позволяет перевести расчёт
    «вид и шум по фасадам» в конкретную категорию номера.
  value_fields:
    categories: {type: list, title: Категории номеров и стороны}
  recipe:
    - tool: hotelier.ask
      when: always_once
  confidence_threshold: 0.5
  ttl_days: 365
  conflict:
    fields: []
    authority: [hotelier_confirmed, hotelier]
    policy: priority
  question:
    text: Какие категории номеров есть в отеле и на какую сторону (на море, во двор, на улицу, на горы) выходят их окна?
    fields: [categories]
