name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Зависимости
        run: pip install -r backend/requirements-dev.txt
      - name: Линтер
        working-directory: backend
        run: ruff check app tests
      - name: Тесты (геодвижок, парсеры, сквозной API на SQLite)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Скриншоты README сжаты (каждый до 300 КБ)
        run: test -z "$(find docs/img -type f -size +300k)"
      - run: npm ci
        working-directory: frontend
      - name: Проверка типов и сборка
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t ostrovok-hotel-knowledge .
      - name: docker compose up и /health
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 3
          done
          curl -sf http://localhost:8080/health
          curl -sf -X POST http://localhost:8080/api/search -H 'Content-Type: application/json' \
            -d '{"query":"тихий номер с видом на закат недалеко от моря"}' | head -c 400
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs app
